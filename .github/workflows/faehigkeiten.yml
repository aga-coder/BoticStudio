name: Fähigkeiten

on:
  push:
    paths: ["faehigkeiten/**", ".github/workflows/faehigkeiten.yml"]
  pull_request:
    paths: ["faehigkeiten/**", ".github/workflows/faehigkeiten.yml"]

jobs:
  mail_lesen:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: faehigkeiten/mail_lesen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
