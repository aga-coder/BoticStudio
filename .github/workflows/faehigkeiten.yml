name: Fähigkeiten

on:
  push:
    paths: ["faehigkeiten/**", ".github/workflows/faehigkeiten.yml"]
  pull_request:
    paths: ["faehigkeiten/**", ".github/workflows/faehigkeiten.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        modul: [mail_lesen, besondere_daten_pruefen, mail_einordnen]
    defaults:
      run:
        working-directory: faehigkeiten/${{ matrix.modul }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
